name: Build and Upload Wheels

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_wheels:
    # cibuildwheel builds every CPython version inside manylinux/musllinux
    # containers, so a single job covers all versions; the host Python only
    # runs cibuildwheel itself.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-*"
          # keep glibc 2.17 compatibility as in previous releases
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_I686_IMAGE: manylinux2014
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Upload to PyPI with Twine
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          twine upload --verbose --skip-existing wheelhouse/*
